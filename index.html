<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英文單字朗讀＋測驗 🍬</title>
<style>
/* ============================================================
   彩虹馬卡龍可愛風（純 CSS，無任何外部資源）
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;color:#5b4b6a;
  background:linear-gradient(160deg,#ffe3ef 0%,#fff6d8 32%,#e0f1ff 66%,#e0fbec 100%);
  background-attachment:fixed;
  padding:16px 14px 70px;
  line-height:1.6;
}
[hidden]{display:none !important;}

/* 飄浮 emoji */
.floaty{position:fixed;font-size:44px;opacity:.45;pointer-events:none;z-index:0;
  animation:floaty 11s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.08));}
.floaty.f1{top:6%;left:4%;animation-delay:0s}
.floaty.f2{top:14%;right:6%;animation-delay:1.5s;font-size:38px}
.floaty.f3{bottom:16%;left:7%;animation-delay:3s;font-size:40px}
.floaty.f4{bottom:8%;right:9%;animation-delay:4.5s}
.floaty.f5{top:44%;left:46%;animation-delay:2.2s;font-size:32px}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-22px) rotate(5deg)}}

.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;}

/* 卡片 */
.card{
  background:rgba(255,255,255,.88);
  border-radius:28px;
  padding:20px 18px;
  margin:14px 0;
  box-shadow:0 12px 26px rgba(255,146,190,.28), 0 3px 0 #ffffff inset;
  border:3px solid #ffffff;
}

/* 標題與大字 */
h1{font-size:30px;margin:6px 0 4px;text-align:center;letter-spacing:1px;}
h2{font-size:22px;margin:4px 0 10px;text-align:center;}
.rainbow{
  background:linear-gradient(92deg,#ff7fab 0%,#ffb84d 22%,#7fd8a8 45%,#6db8ff 68%,#b78bff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;
}
.wordbig{
  font-size:clamp(46px,15vw,92px);
  font-weight:800;text-align:center;letter-spacing:2px;margin:6px 0;
  word-break:break-all;
}
.cntext{font-size:clamp(24px,7vw,34px);text-align:center;font-weight:700;color:#e0568a;margin:2px 0 10px;}
.cnIcon{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;background:linear-gradient(145deg,#ffffff,#fff2f8);border-radius:50%;box-shadow:0 2px 7px rgba(224,86,138,.3);font-size:1em;margin-right:.5em;vertical-align:middle;}
.cnIcon svg{width:1em;height:1em;display:block;}
.exline{font-size:clamp(18px,5vw,23px);text-align:center;color:#3c6ea5;font-weight:600;word-break:break-word;}
.excnn{font-size:clamp(16px,4.6vw,20px);text-align:center;color:#7d8aa0;margin-top:4px;}
.idxlabel{text-align:center;font-size:15px;color:#a08bbd;font-weight:700;}

/* 胖按鈕（按下去會下沉） */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:56px;padding:12px 20px;margin:6px 4px;
  border:none;border-radius:999px;
  font-size:20px;font-weight:700;font-family:inherit;color:#5b4b6a;
  cursor:pointer;user-select:none;
  background:#ffffff;
  box-shadow:0 6px 0 rgba(160,120,170,.30);
  transition:transform .06s ease, box-shadow .06s ease;
}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(160,120,170,.30);}
.btn.big{min-height:74px;font-size:23px;padding:16px 26px;width:100%;margin:8px 0;}
.btn.pink{background:linear-gradient(180deg,#ffd9e8,#ffc0d8);}
.btn.yellow{background:linear-gradient(180deg,#fff3c9,#ffe69b);}
.btn.blue{background:linear-gradient(180deg,#d9edff,#b8ddff);}
.btn.green{background:linear-gradient(180deg,#d6f7e4,#b1ecc9);}
.btn.purple{background:linear-gradient(180deg,#eadcff,#d8c4ff);}
.btn.small{min-height:44px;font-size:16px;padding:8px 16px;}
.btn:disabled{opacity:.55;cursor:default;}
.btnrow{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;}

/* 圓點導航 */
.dotrow{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:12px 0 4px;}
.dot{width:18px;height:18px;border-radius:50%;background:#e8e0f2;border:2px solid #fff;
  box-shadow:0 2px 5px rgba(0,0,0,.10);transition:transform .15s;}
.dot.cur{background:#ffd76e;transform:scale(1.28);border-color:#fff6d8;}
.dot.ok{background:#7ed9a3;}
.dot.bad{background:#ff9dbb;}

/* 回饋框 */
.feedback{border-radius:22px;padding:14px 16px;margin:12px 0;font-size:19px;font-weight:700;text-align:center;
  box-shadow:0 4px 0 rgba(0,0,0,.06);}
.feedback.ok{background:#cdf3dd;color:#1f7a4d;}
.feedback.near{background:#fff1c4;color:#9a6b00;}
.feedback.err{background:#ffd6e2;color:#b03060;}
.feedback.info{background:#dbeeff;color:#205f96;}
.feedback.warn{background:#ffe3c9;color:#a25a10;}

/* 表單 */
input[type=text]{
  width:100%;min-height:56px;border-radius:20px;border:3px solid #ffd2e4;
  font-size:22px;padding:10px 16px;font-family:inherit;color:#5b4b6a;background:#fff;
  outline:none;
}
input[type=text]:focus{border-color:#ff9dc4;}
.muted{color:#9a8fb0;font-size:15px;text-align:center;}

/* 進度條 */
.pbar{height:18px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.08);margin:8px 0;}
.pbar>i{display:block;height:100%;width:0;border-radius:10px;
  background:linear-gradient(90deg,#ff8fab,#ffd166,#8ee6c8,#8ecae6);transition:width .35s ease;}

/* 選項 */
.option{display:block;width:100%;margin:8px 0;text-align:center;font-size:22px;}
.option.right{background:linear-gradient(180deg,#b9f0cf,#8fe0b4);}
.option.wrong{background:linear-gradient(180deg,#ffc6d4,#ffa8bf);}

/* 錄音 */
.micbtn{min-height:92px;font-size:28px;width:100%;border-radius:32px;
  background:linear-gradient(180deg,#ffd9e8,#ff9fc4);color:#7a2b4d;}
.micbtn.rec{background:linear-gradient(180deg,#ffb3b3,#ff7d7d);color:#6b1414;}
.rectimer{font-size:34px;font-weight:800;text-align:center;color:#7a5b96;letter-spacing:2px;}
.vol{height:20px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.08);}
.vol>i{display:block;height:100%;width:0;border-radius:10px;
  background:linear-gradient(90deg,#8ee6c8,#ffd166,#ff8fab);transition:width .08s linear;}
.rec-list{list-style:none;padding:0;margin:10px 0;}
.rec-item{background:#fff;border-radius:20px;padding:12px 14px;margin:8px 0;
  box-shadow:0 4px 12px rgba(150,120,180,.18);font-size:17px;}
.rec-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;}
.rec-actions audio{width:100%;max-width:280px;height:40px;}

/* 成績 */
.scorebig{font-size:64px;font-weight:900;text-align:center;margin:4px 0;}
.wronglist{list-style:none;padding:0;margin:10px 0;}
.wronglist li{background:#fff2f6;border-radius:16px;padding:10px 12px;margin:6px 0;font-size:16px;color:#a34b6c;}
.goodlist{background:#e8f9ef;border-radius:16px;padding:10px 12px;color:#1f7a4a;font-weight:700;text-align:center;}

/* 語音狀態 */
.voicetag{display:inline-block;background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;color:#8a76a8;
  box-shadow:0 2px 6px rgba(0,0,0,.08);margin:4px auto;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.center{text-align:center;}

@media (min-width:560px){
  body{padding-top:26px;}
  .card{padding:26px 26px;}
}
</style>
</head>
<body>

<div class="floaty f1">☁️</div><div class="floaty f2">🌈</div><div class="floaty f3">🐻</div>
<div class="floaty f4">🍬</div><div class="floaty f5">⭐</div>

<div class="wrap">

<!-- ================= 首頁 ================= -->
<section id="screen-home" class="screen">
  <div class="card">
    <h1 class="rainbow">🍬 英文單字小站</h1>
    <p class="center">聽發音、錄作業、玩測驗！</p>
    <label for="nameInput"><b>👤 請輸入你的姓名（必填）</b></label>
    <input type="text" id="nameInput" placeholder="例如：王小明" autocomplete="name">
    <p id="homeErr" class="feedback err" hidden></p>
    <button id="btnEnter" class="btn big pink">💖 進入小站</button>
  </div>

  <div id="homeMenu" hidden>
    <div class="card">
      <h2>你好，<span id="homeName" class="rainbow"></span>！要玩什麼呢？</h2>
      <button id="btnListen" class="btn big yellow">🎧 聽力練習</button>
      <button id="btnRecord" class="btn big green">🎙️ 錄音作業</button>
      <button id="btnQuiz" class="btn big blue">📝 單字測驗</button>
    </div>
    <div class="card">
      <p class="muted">📌 提示：本頁需要部署到 https（例如 GitHub Pages）才能記住麥克風權限；<br>
      老師端的 Apps Script 部署說明見 Code.gs。</p>
    </div>
  </div>
</section>

<!-- ================= 聽力練習 ================= -->
<section id="screen-listen" class="screen" hidden>
  <div class="card">
    <div class="center">
      <button class="btn small purple" data-home>🏠 回首頁</button>
      <span id="listenWho" class="voicetag"></span>
    </div>
    <h2>🎧 聽力練習</h2>
    <p class="idxlabel" id="listenIdx"></p>
    <div class="wordbig rainbow" id="listenWord"></div>
    <div class="cntext"><span class="cnIcon" id="listenIcon" aria-hidden="true"></span><span id="listenCn"></span></div>
    <div class="exline" id="listenEx"></div>
    <div class="excnn" id="listenExCn"></div>
    <div id="listenFeedback" class="feedback info" hidden></div>
    <div class="btnrow">
      <button id="btnListenReplay" class="btn yellow">🔊 重聽（單字→例句）</button>
      <button id="btnListenMic" class="btn pink">🎤 唸出來</button>
    </div>
    <label class="center" style="display:block;font-size:17px;font-weight:700;">
      <input type="checkbox" id="autoToggle" checked style="width:22px;height:22px;vertical-align:middle;">
      🔁 自動模式（自動發音＋自動聽）
    </label>
    <div class="center"><span class="voicetag" id="voiceTag">🔊 目前聲音：載入中…</span></div>
    <div class="dotrow" id="listenDots"></div>
    <div class="btnrow">
      <button id="btnListenPrev" class="btn blue">⬅️ 上一個</button>
      <button id="btnListenNext" class="btn blue">下一個 ➡️</button>
    </div>
    <p class="muted">（也可以左右滑動翻頁）</p>
  </div>
</section>

<!-- ================= 錄音作業 ================= -->
<section id="screen-record" class="screen" hidden>
  <div class="card">
    <div class="center">
      <button class="btn small purple" data-home>🏠 回首頁</button>
      <span id="recWho" class="voicetag"></span>
    </div>
    <h2>🎙️ 錄音作業</h2>
    <p class="idxlabel" id="recIdx"></p>
    <div class="wordbig rainbow" id="recWord"></div>
    <div class="cntext"><span class="cnIcon" id="recIcon" aria-hidden="true"></span><span id="recCn"></span></div>
    <div class="exline" id="recEx"></div>
    <div class="excnn" id="recExCn"></div>

    <button id="btnMic" class="btn micbtn">🎤 開始錄音</button>
    <div class="rectimer" id="recTimer">00:00</div>
    <div class="vol"><i id="volFill"></i></div>

    <div id="recStatus" class="feedback info" hidden></div>
    <div class="btnrow" id="recRetryRow" hidden>
      <button id="btnRetryUpload" class="btn yellow">🔁 重試上傳</button>
      <button id="btnRerecord" class="btn pink">🔁 重錄</button>
      <button id="btnSkipWord" class="btn blue">下一個 ➡️</button>
    </div>

    <h2 style="font-size:19px;">✅ 完成清單</h2>
    <ul class="rec-list" id="recList"></ul>

    <div class="dotrow" id="recDots"></div>
    <div class="btnrow">
      <button id="btnRecPrev" class="btn blue">⬅️ 上一個</button>
      <button id="btnRecNext" class="btn blue">下一個 ➡️</button>
    </div>
    <p class="muted">（左右滑動也能翻頁；本頁不會啟動語音辨識）</p>
  </div>
</section>

<!-- ================= 單字測驗 ================= -->
<section id="screen-quiz" class="screen" hidden>
  <div class="card" id="quizPlayCard">
    <div class="center">
      <button class="btn small purple" data-home>🏠 回首頁</button>
      <span id="quizWho" class="voicetag"></span>
    </div>
    <h2>📝 單字測驗</h2>
    <div class="pbar"><i id="quizBar"></i></div>
    <p class="idxlabel" id="quizCount"></p>
    <div class="wordbig rainbow" id="quizWord"></div>
    <div id="quizOptions"></div>
    <div id="quizFeedback" class="feedback" hidden></div>
    <div id="quizReview" class="feedback info" hidden></div>
    <button id="btnQuizNext" class="btn big green" hidden>下一題 ➡️</button>
    <div class="dotrow" id="quizDots"></div>
    <div class="btnrow">
      <button id="btnQuizPrev" class="btn blue">⬅️ 上一個</button>
      <button id="btnQuizSpeak" class="btn yellow">🔊 再聽一次</button>
    </div>
  </div>

  <div class="card" id="quizResultCard" hidden>
    <h1 class="rainbow">📊 你的成績</h1>
    <div class="scorebig rainbow" id="resultScore"></div>
    <p class="center" id="resultDetail" style="font-size:19px;font-weight:700;"></p>
    <div id="resultWrongWrap">
      <h2 style="font-size:19px;">錯題清單</h2>
      <ul class="wronglist" id="resultWrong"></ul>
    </div>
    <div id="quizUpStatus" class="feedback info" hidden></div>
    <div class="btnrow">
      <button id="btnQuizAgain" class="btn pink">🔁 重新測驗</button>
      <button id="btnQuizWrongOnly" class="btn yellow">🎯 只測錯題</button>
      <button id="btnQuizReupload" class="btn blue">📤 重傳成績</button>
    </div>
  </div>
</section>

</div><!-- /wrap -->

<script>
/* ==================================================================
   ⚙️ 設定區（老師部署後，把 /exec 網址貼到 scriptURL）
   ================================================================== */
const scriptURL = "https://script.google.com/macros/s/AKfycbxDwV_bAZah-YZ5Qmq_N08UYiMXnPck30agFt4OEcd6V5-Umz1ghBPEruE6pjZQjhvFJQ/exec";   // 部署後貼上 /exec 連結
const TOPIC = "unit1";         // 主題／班次
const REC_SHEET = "錄音紀錄";   // 錄音分頁名
const QUIZ_SHEET = "測驗成績";  // 成績分頁名
const DRIVE_FOLDER = "";       // Drive 資料夾 ID；空白＝後端自動建立的「線上錄音作業」資料夾

/* 單字資料：新增單字＝複製一筆修改即可 */
const WORDS = [
  {w:"whale",    cn:"鯨魚",   icon:"🐋", ex:"The whale swam across the ocean.",        exCn:"鯨魚游過了海洋。"},
  {w:"tortoise", cn:"陸龜",   icon:"🐢", ex:"The tortoise walked slowly across the road.", exCn:"陸龜慢慢地走過馬路。"},
  {w:"penguin",  cn:"企鵝",   icon:"🐧", ex:"The penguin dived into the cold water.",  exCn:"企鵝跳進冰冷的水中。"},
  {w:"wallaby",  cn:"小袋鼠", icon:"🦘", ex:"A wallaby hopped out of the bushes.",     exCn:"一隻小袋鼠從灌木叢中跳了出來。"},
  {w:"gopher",   cn:"地鼠",   icon:'<svg viewBox="2.5 6.5 27 25.5" width="1em" height="1em" role="img" aria-label="gopher"><ellipse cx="16" cy="27.4" rx="13" ry="4" fill="#f0d9b5"/><path d="M9.5 27.5v-7.5a6.5 6.5 0 0 1 13 0v7.5z" fill="#c98a56"/><circle cx="16" cy="15.4" r="7.8" fill="#e0a76e"/><circle cx="10.4" cy="9.4" r="2.7" fill="#c98a56"/><circle cx="21.6" cy="9.4" r="2.7" fill="#c98a56"/><circle cx="10.4" cy="9.4" r="1.3" fill="#f7cdb8"/><circle cx="21.6" cy="9.4" r="1.3" fill="#f7cdb8"/><circle cx="13" cy="14.4" r="1.8" fill="#3a2a21"/><circle cx="19" cy="14.4" r="1.8" fill="#3a2a21"/><circle cx="13.6" cy="13.8" r=".65" fill="#ffffff"/><circle cx="19.6" cy="13.8" r=".65" fill="#ffffff"/><ellipse cx="16" cy="17.3" rx="1.6" ry="1.2" fill="#8a5240"/><path d="M14.2 18.8h1.7v3.4a.85.85 0 0 1-1.7 0z" fill="#ffffff" stroke="#e6d7c6" stroke-width=".35"/><path d="M16.1 18.8h1.7v3.4a.85.85 0 0 1-1.7 0z" fill="#ffffff" stroke="#e6d7c6" stroke-width=".35"/><ellipse cx="11.2" cy="26.6" rx="2.3" ry="1.5" fill="#e0a76e"/><ellipse cx="20.8" cy="26.6" rx="2.3" ry="1.5" fill="#e0a76e"/></svg>', ex:"The gopher dug a hole in the garden.",    exCn:"地鼠在花園裡挖了一個洞。"},
  {w:"raccoon",  cn:"浣熊",   icon:"🦝", ex:"The raccoon washed its food by the river.", exCn:"浣熊在河邊清洗它的食物。"}
];
/* 依單字回傳小圖標（上傳資料沒存 icon，完成清單用字查詢） */
/* 把圖標包進圓徽（emoji / SVG 通用） */
function iconWrap(ic){ return ic ? '<span class="cnIcon" aria-hidden="true">' + ic + "</span>" : ""; }
function iconOf(w){ const f = WORDS.filter(function(x){ return x.w === w; })[0]; return (f && f.icon) ? iconWrap(f.icon) : ""; }
/* 文字跳脫：innerHTML 顯示文字前用（防 < > & 破版） */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ===== 內嵌上課音檔（老師指定人聲）=====
   單字＝16_guy 溫柔慢版、例句＝13_emma 溫柔慢版（語速均 -15%）

/* ==================================================================
   語音合成：優先挑美式聲音（Google → Natural/Neural → Microsoft → 系統預設）
   ================================================================== */
let chosenVoice = null;
function pickVoice(){
  if(!("speechSynthesis" in window)){ return null; }
  const vs = window.speechSynthesis.getVoices() || [];
  if(!vs.length){ return null; }
  const norm = s => String(s||"").toLowerCase().replace("_","-");
  const enUS = vs.filter(v => norm(v.lang).indexOf("en-us") === 0);
  let v = enUS.find(v => /google/i.test(v.name))
       || enUS.find(v => /natural|neural/i.test(v.name))
       || enUS.find(v => /microsoft/i.test(v.name))
       || enUS[0]
       || vs.find(v => norm(v.lang).indexOf("en") === 0)
       || null;
  chosenVoice = v;
  if($("voiceTag")){
    $("voiceTag").textContent = "🔊 目前聲音：" + (v ? v.name + "（" + v.lang + "）" : "系統預設");
  }
  return v;
}
if("speechSynthesis" in window){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = function(){ pickVoice(); };
}

let speakSeq = 0;
function speakCancel(){
  speakSeq++;
  if("speechSynthesis" in window){
    try{ window.speechSynthesis.cancel(); }catch(e){}
  }
  if(clipEl){ try{ clipEl.pause(); }catch(e){} }   /* 內嵌音檔也一起停 */
}
/* 退回用瀏覽器語音念（沒有音檔或音檔播放失敗時） */
function speakRaw(text){
  return new Promise(function(resolve){
    if(!("speechSynthesis" in window)){ resolve(); return; }
    try{ window.speechSynthesis.cancel(); }catch(e){}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.85; u.pitch = 1.05;
    if(chosenVoice){ u.voice = chosenVoice; }
    let done = false;
    function fin(){ if(done){ return; } done = true; clearTimeout(tm); resolve(); }
    const tm = setTimeout(fin, 5000 + text.length * 230);  // 安全上限，避免卡住
    u.onend = fin; u.onerror = fin;
    u.onstart = function(){ try{ window.speechSynthesis.pause(); window.speechSynthesis.resume(); }catch(e){} };
    try{ window.speechSynthesis.speak(u); }catch(e){ fin(); }
  });
}
function speak(text, tag){
  STATS.speakLog.push(tag || ("auto:" + text));
  return speakRaw(text);
}
/* ---- 內嵌音檔播放（老師指定人聲：單字＝guy、例句＝emma，均 -15% 語速） ---- */
let clipEl = null;
function playClip(url){
  return new Promise(function(resolve){
    let done = false, tm = null;
    function fin(ok){
      if(done){ return; } done = true;
      if(tm){ clearTimeout(tm); }
      try{
        if(clipEl){
          clipEl.removeEventListener("ended", onEnd);
          clipEl.removeEventListener("error", onErr);
          clipEl.removeEventListener("pause", onPause);
        }
      }catch(e){}
      resolve(ok !== false);
    }
    function onEnd(){ fin(true); }
    function onErr(){ fin(false); }
    function onPause(){ fin(true); }
    try{
      if(!clipEl){ clipEl = new Audio(); clipEl.preload = "auto"; }
      clipEl.pause();
      clipEl.src = url;
      clipEl.addEventListener("ended", onEnd);
      clipEl.addEventListener("error", onErr);
      clipEl.addEventListener("pause", onPause);
      tm = setTimeout(function(){ fin(true); }, 20000);     /* 安全上限，避免卡在這裡 */
      const p = clipEl.play();
      if(p && typeof p.catch === "function"){ p.catch(function(){ fin(false); }); }  /* 自動播放被擋 → 退回瀏覽器語音 */
    }catch(e){ fin(false); }
  });
}
/* 智慧朗讀：有音檔播音檔，沒有／播不出來就退回瀏覽器語音（tag 記錄方式不變） */
function speakClip(text, tag, url){
  STATS.speakLog.push(tag || ("auto:" + text));
  if(!url){ return speakRaw(text); }
  return playClip(url).then(function(ok){ return ok ? null : speakRaw(text); });
}
function wordClip(i){
  const b = (typeof WORD_AUDIO === "object" && WORD_AUDIO) ? WORD_AUDIO[WORDS[i].w] : "";
  return b ? ("data:audio/mp3;base64," + b) : "";
}
function exClip(i){
  const b = (typeof EX_AUDIO === "object" && EX_AUDIO) ? EX_AUDIO[WORDS[i].w] : "";
  return b ? ("data:audio/mp3;base64," + b) : "";
}
/* 換到新單字的示範朗讀：單字 → 例句 */
async function speakWordThenExample(idx, tagPrefix){
  const my = ++speakSeq;
  await speakClip(WORDS[idx].w, (tagPrefix||"auto") + ":word", wordClip(idx));
  if(my !== speakSeq){ return; }
  await speakClip(WORDS[idx].ex, (tagPrefix||"auto") + ":ex", exClip(idx));
}

/* ==================================================================
   圓點導航：🟡目前 / 🟩已完成 / 🩷失敗
   ================================================================== */
function renderDots(containerId, statuses, current){
  const box = $(containerId);
  box.innerHTML = "";
  for(let i=0;i<statuses.length;i++){
    const d = document.createElement("span");
    d.className = "dot";
    if(i === current){ d.className += " cur"; }
    else if(statuses[i] === "ok"){ d.className += " ok"; }
    else if(statuses[i] === "bad"){ d.className += " bad"; }
    box.appendChild(d);
  }
}

/* ==================================================================
   上傳（fetch + text/plain，避開 CORS preflight）
   ================================================================== */
function upload(payload){
  if(!scriptURL){
    return Promise.resolve({ok:false, error:"尚未設定 scriptURL：請先部署 Code.gs，再把 /exec 網址貼到 index.html 的 scriptURL。"});
  }
  return fetch(scriptURL, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},   /* 不可用 application/json，會觸發 CORS preflight */
    body: JSON.stringify(payload)
  }).then(function(res){ return res.text(); }).then(function(t){
    try{ return JSON.parse(t); }
    catch(e){ return {ok:false, error:"後端回傳的不是 JSON：" + t.slice(0,180)}; }
  });
}

function enterListen(){
  state.listen.retry = 0;
  renderListen();

    const idx = state.listen.idx;
    speakWordThenExample(idx, "auto").then(function(){
      if(state.screen !== "listen" || state.listen.idx !== idx || !state.listen.auto){ return; }

function renderListen(){
  const i = state.listen.idx;
  $("listenWord").textContent = WORDS[i].w;
  $("listenCn").textContent   = WORDS[i].cn;
  $("listenIcon").innerHTML = WORDS[i].icon || "";

  $("listenExCn").textContent = WORDS[i].exCn;
  $("listenIdx").textContent  = "單字 " + (i+1) + " / " + WORDS.length;
  const st = [];
  for(let k=0;k<WORDS.length;k++){
    const s = state.listen.status[k];
    st.push(s === "pass" ? "ok" : (s === "near" || s === "fail" ? "bad" : "none"));

function setListenFeedback(kind, msg){
  const fb = $("listenFeedback");

function markListen(v){
  state.listen.status[state.listen.idx] = v;

function goListen(delta){
  stopRecognition(); speakCancel();
  state.listen.idx = (state.listen.idx + delta + WORDS.length) % WORDS.length;
  enterListen();
}

/* ---- 語音辨識（token 作廢 + onend 不覆蓋判讀結果） ---- */
let recognition = null, recogToken = 0, recogGotResult = false;

function stopRecognition(){
  recogToken++;                       /* 地雷8：作廢未來所有回呼 */
  if(recognition){
    try{ recognition.abort(); }catch(e){}   /* 地雷8：離開畫面先 abort */
    try{ recognition.onresult = null; recognition.onend = null; recognition.onerror = null; }catch(e){}
    recognition = null;
  }
}
function startRecognition(isAuto){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    setListenFeedback("warn","😢 這台裝置的瀏覽器不支援語音辨識，請改用 Chrome（手機請用 Android Chrome）。");
    return;
  }
  stopRecognition();
  const token = ++recogToken;
  recogGotResult = false;             /* 地雷7：onresult 之後 onend 也會觸發 */
  const r = new SR();
  recognition = r;
  r.lang = "en-US"; r.continuous = false; r.interimResults = false; r.maxAlternatives = 5;
  STATS.recogStarts++;

  r.onresult = function(ev){
    if(token !== recogToken){ return; }
    recogGotResult = true;
    const alts = ev.results[0];
    let best = "", bestScore = -1;
    for(let i=0;i<alts.length;i++){
      const sc = (typeof alts[i].confidence === "number" && alts[i].confidence > 0) ? alts[i].confidence : 0.5;
      if(sc > bestScore){ bestScore = sc; best = alts[i].transcript || ""; }
    }
    handleHeard(best, isAuto);
  };
  r.onerror = function(ev){
    if(token !== recogToken){ return; }
    if(ev.error === "not-allowed" || ev.error === "service-not-allowed"){
      setListenFeedback("err","🎤 麥克風權限被拒絕，請到瀏覽器設定允許這個網站使用麥克風，再重新整理。");
      return;
    }
    if(ev.error === "no-speech" || ev.error === "audio-capture"){ return; }  /* 交給 onend 處理 */
    setListenFeedback("warn","語音辨識發生問題（" + ev.error + "），請按 🎤 唸出來 再試一次。");
  };
  r.onend = function(){
    if(token !== recogToken){ return; }
    if(!recogGotResult){ autoRetryListen("沒聽到聲音，再唸一次試試看 🎤"); }
  };
  try{ r.start(); }
  catch(e){ setListenFeedback("warn","語音辨識啟動失敗：" + e.message); }
}
function judgeHeard(transcript, word){
  const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9'\s]/g," ").replace(/\s+/g," ").trim();
  const t = norm(transcript), w = norm(word);
  if(!t){ return "none"; }
  if(t === w){ return "pass"; }
  if(new RegExp("(^|\\s)" + w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "(\\s|$)").test(t)){ return "pass"; }
  const first = t.split(" ")[0];
  if(t.indexOf(w) >= 0 || w.indexOf(first) >= 0 && first.length >= 4){ return "near"; }
  if(levenshtein(first, w) <= 2){ return "near"; }
  return "fail";
}
function levenshtein(a, b){
  a = String(a||""); b = String(b||"");
  const m = a.length, n = b.length;
  if(!m){ return n; } if(!n){ return m; }
  let prev = [], cur = [];
  for(let j=0;j<=n;j++){ prev[j] = j; }
  for(let i=1;i<=m;i++){
    cur[0] = i;
    for(let j=1;j<=n;j++){
      const cost = (a.charCodeAt(i-1) === b.charCodeAt(j-1)) ? 0 : 1;
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
    }
    prev = cur.slice();
  }
  return prev[n];
}
function handleHeard(transcript, isAuto){
  const w = WORDS[state.listen.idx].w;
  const v = judgeHeard(transcript, w);
  const heard = (transcript||"").trim();
  if(v === "pass"){
    markListen("pass");
    setListenFeedback("ok","🎉 唸對啦！" + w + " 唸得超棒！");
    if(navigator.vibrate){ navigator.vibrate(180); }      /* 手機震動 */
  }else if(v === "near"){
    markListen("near");
    setListenFeedback("near","😊 很接近，再試一次！（你唸成：" + heard + "）");
    if(isAuto){ autoRetryListen("再試一次喔 💪"); }
  }else if(v === "none"){
    setListenFeedback("warn","🎤 沒聽清楚，請靠近麥克風再唸一次。");
  }else{
    markListen("fail");
    setListenFeedback("err","💪 差一點，正確單字是 " + w + "。（你唸成：" + heard + "）");
    if(isAuto){ autoRetryListen("再聽一次標準發音 🔁"); }
  }
}
/* 自動再聽：最多 2 次（不可無限循環）；判讀訊息保留，只附加註記 */
function appendRetryNote(kind, text){
  const fb = $("listenFeedback");
  fb.hidden = false;
  fb.className = "feedback " + kind;
  if(!fb.textContent){ fb.textContent = text; }
  else{ fb.textContent = fb.textContent + "　" + text; }

function autoRetryListen(msg){
  if(!state.listen.auto){ return; }
  if(state.listen.retry >= 2){
    appendRetryNote("warn", "（🔁 自動重聽已用完 2 次，請按 🎤 唸出來 手動重試）");
    return;
  }
  state.listen.retry++;
  const idx = state.listen.idx;
  appendRetryNote("info", "（🔁 " + msg + "　第 " + state.listen.retry + " / 2 次）");
  speakClip(WORDS[idx].w, "auto:retry", wordClip(idx)).then(function(){
    if(state.screen !== "listen" || state.listen.idx !== idx || !state.listen.auto){ return; }
    startRecognition(true);

}

/* ==================================================================
   麥克風權限：整個工作階段只取一次（地雷1）
   ================================================================== */
let mediaStream = null, micDeniedFlag = false;
function queryMicPermission(){
  if(!navigator.permissions || !navigator.permissions.query){
    return Promise.resolve("prompt");
  }
  try{
    return navigator.permissions.query({name:"microphone"}).then(function(s){ return s.state || "prompt"; })
      .catch(function(){ return "prompt"; });
  }catch(e){ return Promise.resolve("prompt"); }
}
function ensureStream(){
  if(mediaStream && mediaStream.getAudioTracks().length && mediaStream.getAudioTracks()[0].readyState === "live"){
    return Promise.resolve(mediaStream);
  }
  if(micDeniedFlag){
    return Promise.reject(new Error("麥克風權限被拒絕，請到瀏覽器設定允許這個網站使用麥克風，再重新整理頁面。"));
  }
  return queryMicPermission().then(function(perm){
    if(perm === "denied"){
      micDeniedFlag = true;
      throw new Error("麥克風權限被拒絕（瀏覽器已記住），請到網址列左方的鎖頭 → 網站設定 → 麥克風 → 允許，再重新整理。");
    }
    STATS.getUserMediaCalls++;                    /* 用於驗證：整段作業只會呼叫一次 */
    return navigator.mediaDevices.getUserMedia({audio:true});
  }).then(function(s){
    mediaStream = s;                              /* 地雷3：錄音結束也不關掉 stream */
    return s;
  });
}

/* ==================================================================
   ② 錄音作業（本頁絕對不啟動語音辨識，避免搶麥克風）
   ================================================================== */
let mediaRecorder = null, recChunks = [], recMime = "", recSeconds = 0, recStartTs = 0,
    recTimerId = null, recRafId = null, audioCtx = null, analyser = null, pendingUpload = null;

function pickRecorderMime(){
  if(typeof MediaRecorder === "undefined"){ return ""; }
  const list = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"];   /* 地雷10：逐一測試 */
  for(let i=0;i<list.length;i++){
    if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(list[i])){ return list[i]; }
  }
  return "";
}
function fmtTime(s){
  const m = Math.floor(s/60), r = s % 60;
  return (m<10?"0":"")+m+":"+(r<10?"0":"")+r;
}
function setRecStatus(kind, msg){
  const el = $("recStatus");
  el.hidden = false;
  el.className = "feedback " + kind;
  el.textContent = msg;
}
function updateRecUI(isRec){
  const b = $("btnMic");
  if(isRec){ b.classList.add("rec"); b.textContent = "⏹ 停止錄音"; }
  else{ b.classList.remove("rec"); b.textContent = "🎤 開始錄音"; }
}
function enterRecord(){
  renderRecord();
  renderRecList();
  const idx = state.rec.idx;
  speakWordThenExample(idx, "auto:rec").then(function(){ /* 只朗讀示範，絕不開語音辨識 */
    if(state.screen !== "record" || state.rec.idx !== idx){ return; }
  });
}
function renderRecord(){
  const i = state.rec.idx;
  $("recWord").textContent = WORDS[i].w;
  $("recCn").textContent   = WORDS[i].cn;
  $("recIcon").innerHTML = WORDS[i].icon || "";
  $("recEx").textContent   = WORDS[i].ex;
  $("recExCn").textContent = WORDS[i].exCn;
  $("recIdx").textContent  = "單字 " + (i+1) + " / " + WORDS.length + (state.rec.done[i] ? "　✅ 已完成" : "");
  const st = [];
  for(let k=0;k<WORDS.length;k++){ st.push(state.rec.done[k] ? "ok" : "none"); }
  renderDots("recDots", st, i);
}
function goRec(delta){
  if(mediaRecorder && mediaRecorder.state === "recording"){ stopRec(); return; }
  speakCancel();
  state.rec.idx = (state.rec.idx + delta + WORDS.length) % WORDS.length;
  $("recStatus").hidden = true;
  $("recRetryRow").hidden = true;
  enterRecord();
}
function startRec(){
  if(typeof MediaRecorder === "undefined"){
    setRecStatus("err","❌ 這個瀏覽器不支援錄音（MediaRecorder），請改用 Chrome 或 Safari 14.5 以上。");
    return;
  }
  ensureStream().then(function(stream){
    if(state.screen !== "record"){ return; }
    setupAudioMeter(stream);
    recMime = pickRecorderMime();
    const opts = recMime ? {mimeType:recMime} : {};
    mediaRecorder = new MediaRecorder(stream, opts);
    recChunks = [];
    mediaRecorder.ondataavailable = function(ev){ if(ev.data && ev.data.size){ recChunks.push(ev.data); } };
    mediaRecorder.onstop = onRecStopped;
    mediaRecorder.onerror = function(ev){
      setRecStatus("err","❌ 錄音發生錯誤：" + ((ev.error && ev.error.message) || "未知錯誤"));
    };
    mediaRecorder.start();
    recSeconds = 0; recStartTs = Date.now();
    $("recTimer").textContent = "00:00";
    recTimerId = setInterval(function(){
      recSeconds = Math.floor((Date.now() - recStartTs)/1000);
      $("recTimer").textContent = fmtTime(recSeconds);
    }, 250);
    updateRecUI(true);
    $("recRetryRow").hidden = true;
    setRecStatus("info","🔴 錄音中…講完請按 ⏹ 停止，停止後會自動上傳。");
  }).catch(function(err){
    updateRecUI(false);
    setRecStatus("err","❌ " + err.message);
  });
}
function stopRec(){
  if(!mediaRecorder || mediaRecorder.state !== "recording"){ return; }
  recSeconds = Math.max(1, Math.round((Date.now() - recStartTs)/1000));
  $("recTimer").textContent = fmtTime(recSeconds);
  try{ mediaRecorder.stop(); }catch(e){}
  if(recTimerId){ clearInterval(recTimerId); recTimerId = null; }
  stopAudioMeter();
  updateRecUI(false);
}
function stopRecordIfActive(){
  if(mediaRecorder && mediaRecorder.state === "recording"){ stopRec(); }
}
function onRecStopped(){
  const type = (recChunks[0] && recChunks[0].type) || recMime || "audio/webm";
  const blob = new Blob(recChunks, {type:type});
  recChunks = [];
  if(!blob.size){ setRecStatus("err","❌ 錄不到聲音，請檢查麥克風後按 🎤 重錄。"); return; }
  blobToBase64(blob).then(function(b64){
    autoUploadRecording(b64, type);
  }).catch(function(e){
    setRecStatus("err","❌ 轉檔失敗：" + e.message + "，請按 🎤 重錄。");
  });
}
function blobToBase64(blob){
  return new Promise(function(res, rej){
    const fr = new FileReader();
    fr.onload = function(){ res(String(fr.result).split(",")[1] || ""); };
    fr.onerror = function(){ rej(fr.error || new Error("讀檔失敗")); };
    fr.readAsDataURL(blob);
  });
}
function setupAudioMeter(stream){
  try{
    if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(audioCtx.state === "suspended"){ audioCtx.resume(); }
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    (function loop(){
      if(!analyser){ return; }
      analyser.getByteTimeDomainData(data);
      let peak = 0;
      for(let i=0;i<data.length;i++){ const v = Math.abs(data[i]-128); if(v > peak){ peak = v; } }
      $("volFill").style.width = Math.min(100, Math.round(peak/128*140)) + "%";
      recRafId = requestAnimationFrame(loop);
    })();
  }catch(e){ /* 音量條是配菜，失敗不影響錄音 */ }
}
function stopAudioMeter(){
  if(recRafId){ cancelAnimationFrame(recRafId); recRafId = null; }
  analyser = null;
  $("volFill").style.width = "0%";
}
/* 停止後自動上傳，成功後跳到「下一個未完成」的單字 */
function autoUploadRecording(b64, mime){
  const idx = state.rec.idx;                 /* 先抓住索引，避免使用者翻頁後張冠李戴 */
  pendingUpload = {b64:b64, mime:mime, idx:idx, seconds:recSeconds};
  const payload = {
    action:"record", name:state.name, topic:TOPIC,
    word:WORDS[idx].w, cn:WORDS[idx].cn, seconds:recSeconds,
    audio:b64, mime:mime, sheet:REC_SHEET, folder:DRIVE_FOLDER
  };
  setRecStatus("loading","⏳ 傳送中…（" + WORDS[idx].w + "，" + recSeconds + " 秒）");
  upload(payload).then(function(j){
    if(j && j.ok){
      state.rec.done[idx] = {seconds:recSeconds};
      state.rec.uploads.unshift({idx:idx, word:WORDS[idx].w, cn:WORDS[idx].cn, seconds:recSeconds,
        b64:b64, mime:mime, fileName:j.fileName || "", fileUrl:j.fileUrl || ""});
      $("recRetryRow").hidden = true;
      setRecStatus("ok","✅ 上傳成功！" + (j.fileName ? "檔案：" + j.fileName : "") +
        (j.fileUrl ? "（老師的試算表和 Drive 都收到了）" : ""));
      renderRecList(); renderRecord();
      const next = firstUnfinished(idx);
      if(next === -1){
        setRecStatus("ok","🎉 全部 " + WORDS.length + " 個單字都錄完、上傳成功！");
      }else{
        state.rec.idx = next;
        state.listen.retry = 0;
        setTimeout(function(){
          if(state.screen === "record"){ enterRecord(); }
        }, 900);
      }
    }else{
      setRecStatus("err","❌ 上傳失敗：" + ((j && j.error) || "未知錯誤") + "　請按「🔁 重試上傳」或「🔁 重錄」。");
      $("recRetryRow").hidden = false;
    }
  }).catch(function(err){
    setRecStatus("err","❌ 上傳失敗（網路錯誤）：" + err.message + "　請按「🔁 重試上傳」或「🔁 重錄」。");
    $("recRetryRow").hidden = false;
  });
}
/* 地雷4：找「第一個未完成」必須用 for 迴圈掃，不可用 findIndex 對稀疏陣列 */
function firstUnfinished(fromIdx){
  for(let i=1;i<=WORDS.length;i++){
    const idx = (fromIdx + i) % WORDS.length;
    if(!state.rec.done[idx]){ return idx; }
  }
  return -1;
}
function renderRecList(){

/* ==================================================================
   ③ 單字測驗（一頁一題；題目進行中不顯示例句、不顯示中文翻譯）
   ================================================================== */
function enterQuiz(){
  if(state.quizResult){ showQuizResult(); return; }
  if(state.quiz && !state.quiz.finished && state.quiz.qs && state.quiz.qs.length){ renderQuiz(); return; }
  startQuiz(range(WORDS.length));
}
function range(n){ const a = []; for(let i=0;i<n;i++){ a.push(i); } return a; }
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function buildQuestions(indices){
  return indices.map(function(i){
    const correct = WORDS[i].cn;
    const pool = [];
    for(let k=0;k<WORDS.length;k++){ if(k !== i){ pool.push(WORDS[k].cn); } }
    shuffle(pool);
    const options = [correct].concat(pool.slice(0,3));
    shuffle(options);
    return {wi:i, options:options, answer:correct, chosen:null};
  });
}
function startQuiz(indices){
  if(!indices.length){
    setQuizUp("info","沒有題目可出（錯題清單是空的）。");
    showQuizResult();
    return;
  }
  state.quiz = {qs:buildQuestions(indices), idx:0, startTs:Date.now(), finished:false};
  state.quizResult = null;
  $("quizPlayCard").hidden = false;
  $("quizResultCard").hidden = true;
  $("quizUpStatus").hidden = true;
  renderQuiz();
}
function renderQuiz(){
  const quiz = state.quiz;
  const q = quiz.qs[quiz.idx];
  $("quizWho").textContent = "👤 " + state.name;
  $("quizWord").textContent = WORDS[q.wi].w;
  $("quizCount").textContent = "第 " + (quiz.idx+1) + " / " + quiz.qs.length + " 題";
  $("quizBar").style.width = Math.round(quiz.idx / quiz.qs.length * 100) + "%";
  const box = $("quizOptions");
  box.innerHTML = "";
  q.options.forEach(function(opt, i){
    const b = document.createElement("button");
    b.className = "btn option " + ["pink","yellow","blue","green"][i % 4];
    b.textContent = opt;
    b.onclick = function(){ answerQuiz(i); };
    box.appendChild(b);
  });
  $("quizFeedback").hidden = true;
  $("quizReview").hidden = true;
  $("btnQuizNext").hidden = true;

  speakClip(WORDS[q.wi].w, "auto:quiz", wordClip(q.wi));   /* 每題出現時自動朗讀該單字 */
}
function renderQuizDots(){
  const quiz = state.quiz;
  const st = quiz.qs.map(function(q, i){
    if(q.chosen === null){ return "none"; }
    return q.chosen === q.answer ? "ok" : "bad";
  });
  renderDots("quizDots", st, quiz.idx);
}
function answerQuiz(i){
  const quiz = state.quiz;
  const q = quiz.qs[quiz.idx];
  if(q.chosen !== null){ return; }
  q.chosen = q.options[i];
  const btns = $("quizOptions").children;
  for(let k=0;k<btns.length;k++){
    btns[k].disabled = true;
    if(q.options[k] === q.answer){ btns[k].classList.add("right"); }
    else if(k === i){ btns[k].classList.add("wrong"); }
  }
  const ok = (q.chosen === q.answer);
  const fb = $("quizFeedback");
  fb.hidden = false;
  if(ok){
    fb.className = "feedback ok";
    fb.textContent = "🎉 答對了！";

  }else{
    fb.className = "feedback err";
    fb.textContent = "正確答案是 " + q.answer;      /* 答錯只顯示正確答案 */
  }
  if(SHOW_EXAMPLE_AFTER_ANSWER){

  }

function goQuiz(delta){
  const quiz = state.quiz;
  if(!quiz || quiz.finished){ return; }
  const ni = quiz.idx + delta;
  if(ni < 0 || ni >= quiz.qs.length){ return; }
  quiz.idx = ni;
  renderQuiz();
}
function nextQuiz(){
  const quiz = state.quiz;
  if(quiz.qs[quiz.idx].chosen === null){ return; }   /* 沒作答不能跳下一題 */
  if(quiz.idx < quiz.qs.length - 1){ quiz.idx++; renderQuiz(); }
  else{ finishQuiz(); }
}
function finishQuiz(){
  const quiz = state.quiz;
  quiz.finished = true;
  const seconds = Math.max(1, Math.round((Date.now() - quiz.startTs)/1000));
  let correct = 0;
  const wrongs = [];
  quiz.qs.forEach(function(q){
    if(q.chosen === q.answer){ correct++; }
    else{ wrongs.push({wi:q.wi, word:WORDS[q.wi].w, chosen:(q.chosen || "（未作答）"), answer:q.answer}); }
  });
  state.quizResult = {
    total: quiz.qs.length, correct: correct,
    score: Math.round(correct / quiz.qs.length * 100),
    accuracy: (Math.round(correct / quiz.qs.length * 1000)/10) + "%",
    seconds: seconds, wrongs: wrongs
  };
  showQuizResult();
  uploadQuizResult();                      /* 做完自動上傳成績 */
}
function showQuizResult(){

  $("resultScore").textContent = "📊 " + r.score + " 分";
  $("resultDetail").textContent = "✅ 正確 " + r.correct + " / " + r.total + " 題　·　正確率 " + r.accuracy +
    "　·　用時 " + fmtTime(r.seconds);
  const ul = $("resultWrong");
  ul.innerHTML = "";
  if(!r.wrongs.length){
    ul.innerHTML = '<li class="goodlist">🎉 全部答對，沒有錯題！</li>';
  }else{
    r.wrongs.forEach(function(w){
      const li = document.createElement("li");
      li.textContent = w.word + "：你選「" + w.chosen + "」／正確「" + w.answer + "」";
      ul.appendChild(li);
    });

}
function setQuizUp(kind, msg){
  const el = $("quizUpStatus");
  el.hidden = false;
  el.className = "feedback " + kind;
  el.textContent = msg;
}
function uploadQuizResult(){
  const r = state.quizResult;
  if(!r){ return; }
  const wrongText = r.wrongs.length
    ? r.wrongs.map(function(w){ return w.word + "：你選「" + w.chosen + "」／正確「" + w.answer + "」"; }).join("；")
    : "無";
  const payload = {
    action:"quiz", name:state.name, topic:TOPIC, sheet:QUIZ_SHEET,
    score:r.score, total:r.total, correct:r.correct, accuracy:r.accuracy,
    wrongList:wrongText, seconds:r.seconds
  };
  setQuizUp("loading","⏳ 傳送中…");
  upload(payload).then(function(j){
    if(j && j.ok){ setQuizUp("ok","✅ 成績已上傳老師的試算表！"); }
    else{ setQuizUp("err","❌ 上傳失敗：" + ((j && j.error) || "未知錯誤") + "　請按「📤 重傳成績」。"); }
  }).catch(function(err){
    setQuizUp("err","❌ 上傳失敗（網路錯誤）：" + err.message + "　請按「📤 重傳成績」。");
  });
}

/* ==================================================================
   首頁
   ================================================================== */
function enterHome(){
  if(state.name){
    $("nameInput").value = state.name;
    $("homeMenu").hidden = false;
    $("homeName").textContent = state.name;
    $("btnEnter").hidden = true;
  }else{
    $("homeMenu").hidden = true;
    $("btnEnter").hidden = false;
  }
  $("homeErr").hidden = true;
}
function doEnter(){
  const v = $("nameInput").value.trim();
  if(!v){
    const e = $("homeErr");
    e.hidden = false;
    e.textContent = "請先輸入姓名，才能開始喔！";
    return;
  }
  state.name = v;
  localStorage.setItem("voc_name", v);        /* 留 localStorage 記住 */
  enterHome();
}

/* ==================================================================
   手機左右滑動翻頁
   ================================================================== */
function attachSwipe(el, onPrev, onNext){
  let x0 = 0, y0 = 0;
  el.addEventListener("touchstart", function(ev){
    if(!ev.changedTouches || !ev.changedTouches.length){ return; }
    x0 = ev.changedTouches[0].clientX; y0 = ev.changedTouches[0].clientY;
  }, {passive:true});
  el.addEventListener("touchend", function(ev){
    if(!ev.changedTouches || !ev.changedTouches.length){ return; }
    const dx = ev.changedTouches[0].clientX - x0;
    const dy = ev.changedTouches[0].clientY - y0;
    if(Math.abs(dx) > 60 && Math.abs(dy) < 50){
      if(dx < 0){ onNext(); } else{ onPrev(); }
    }
  }, {passive:true});
}

/* ==================================================================
   事件與初始化
   ================================================================== */
$("btnEnter").addEventListener("click", doEnter);
$("nameInput").addEventListener("keydown", function(e){ if(e.key === "Enter"){ doEnter(); } });

$("btnListen").addEventListener("click", function(){ show("listen"); });
$("btnRecord").addEventListener("click", function(){ show("record"); });
$("btnQuiz").addEventListener("click", function(){ show("quiz"); });
Array.prototype.forEach.call(document.querySelectorAll("[data-home]"), function(b){
  b.addEventListener("click", function(){ show("home"); });
});

/* 聽力 */
$("btnListenPrev").addEventListener("click", function(){ goListen(-1); });
$("btnListenNext").addEventListener("click", function(){ goListen(1); });
$("btnListenReplay").addEventListener("click", function(){
  speakWordThenExample(state.listen.idx, "manual");
});
$("btnListenMic").addEventListener("click", function(){
  setListenFeedback("info","🎤 請唸出：" + WORDS[state.listen.idx].w);
  startRecognition(false);
});
$("autoToggle").addEventListener("change", function(e){
  state.listen.auto = !!e.target.checked;
  stopRecognition(); speakCancel();
  if(state.listen.auto){ enterListen(); }
  else{ setListenFeedback("info","🔁 自動模式已關閉：按 🔊 重聽、🎤 唸出來 手動練習。"); }
});

/* 錄音 */
$("btnMic").addEventListener("click", function(){
  if(mediaRecorder && mediaRecorder.state === "recording"){ stopRec(); }
  else{ startRec(); }
});
$("btnRecPrev").addEventListener("click", function(){ goRec(-1); });
$("btnRecNext").addEventListener("click", function(){ goRec(1); });
$("btnRetryUpload").addEventListener("click", function(){
  if(pendingUpload){ autoUploadRecording(pendingUpload.b64, pendingUpload.mime); }
});
$("btnRerecord").addEventListener("click", function(){
  $("recRetryRow").hidden = true; startRec();
});
$("btnSkipWord").addEventListener("click", function(){
  const next = firstUnfinished(state.rec.idx);
  if(next === -1){ setRecStatus("ok","🎉 所有單字都完成了！"); }
  else{ state.rec.idx = next; enterRecord(); }
});

/* 測驗 */
$("btnQuizNext").addEventListener("click", nextQuiz);
$("btnQuizPrev").addEventListener("click", function(){ goQuiz(-1); });
$("btnQuizSpeak").addEventListener("click", function(){
  if(state.quiz){ const qi = state.quiz.qs[state.quiz.idx].wi; speakClip(WORDS[qi].w, "manual:quiz", wordClip(qi)); }
});
$("btnQuizAgain").addEventListener("click", function(){ startQuiz(range(WORDS.length)); });
$("btnQuizWrongOnly").addEventListener("click", function(){
  const r = state.quizResult;
  const idxs = [];
  r.wrongs.forEach(function(w){ if(idxs.indexOf(w.wi) < 0){ idxs.push(w.wi); } });
  if(!idxs.length){ setQuizUp("info","🎉 你沒有錯題，超強的！"); return; }
  startQuiz(idxs);
});
$("btnQuizReupload").addEventListener("click", uploadQuizResult);

/* 滑動翻頁 */
attachSwipe($("screen-listen"), function(){ goListen(-1); }, function(){ goListen(1); });
attachSwipe($("screen-record"), function(){ goRec(-1); }, function(){ goRec(1); });
attachSwipe($("screen-quiz"), function(){ goQuiz(-1); }, function(){ if(state.quiz && state.quiz.qs[state.quiz.idx].chosen !== null){ nextQuiz(); } });

/* 鍵盤左右鍵（電腦） */
document.addEventListener("keydown", function(e){
  if(state.screen === "listen"){ if(e.key === "ArrowLeft"){ goListen(-1); } if(e.key === "ArrowRight"){ goListen(1); } }
  else if(state.screen === "record"){ if(e.key === "ArrowLeft"){ goRec(-1); } if(e.key === "ArrowRight"){ goRec(1); } }
});

/* 離開頁面時收乾淨（麥克風燈號） */
window.addEventListener("pagehide", function(){
  stopRecognition(); speakCancel();
  if(mediaRecorder && mediaRecorder.state === "recording"){ stopRec(); }
});

/* 啟動 */
show("home");
</script>
